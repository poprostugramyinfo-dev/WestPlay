name: HaulMP Windows checks

on:
  push:
    branches: [feature/haulmp-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: npm ci
      - name: Build cabin UI
        run: npm run build --prefix ui
      - name: Test cabin UI
        run: npm test --prefix ui
      - name: Check Rust workspace
        run: cargo check --workspace
      - name: Test Rust workspace
        # The hosted runner's virtual GPU and process elevation are not representative of a player's PC.
        run: cargo test --workspace -- --skip lists_this_pcs_gpus_with_ids_that_tell_them_apart --skip a_game_run_normally_isnt_elevated
      - name: Build ETS2 plugin
        run: cargo build --release -p westplay-plugin
      - name: Verify x64 plugin and SCS exports
        shell: pwsh
        run: ./tools/verify-plugin.ps1 -Path ./target/release/westplay.dll
      - name: Publish downloadable ETS2 plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: WestPlay-HaulMP-ETS2-win-x64-${{ github.sha }}
          path: target/release/westplay.dll
          if-no-files-found: error
          retention-days: 90
